<!DOCTYPE html>
<html lang="id">
<head>

    <title>Pemantau Pasar Crypto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📊 Pasar Crypto Terkini</h1>

        </div>
    </div>

    <script src="script.js"></script>
